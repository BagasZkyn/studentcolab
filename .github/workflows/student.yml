name: Setup Student Community Compiler

on:
  workflow_dispatch:
    inputs:
      student_code:
        description: "Enter the Student Authentication Code"
        required: true
        default: ""

jobs:
  setup-student:
    runs-on: windows-latest

    steps:
    - name: Authenticate GitHub CLI
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        echo $env:GH_TOKEN | gh auth login --with-token
        gh auth status

    - name: Clone Repository to Downloads
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        $Downloads = "$env:USERPROFILE\Downloads"

        if (!(Test-Path $Downloads)) {
          New-Item -ItemType Directory -Path $Downloads -Force
        }

        Set-Location $Downloads

        gh repo clone NathanKanaeru/samptest

        Write-Host "Repository cloned successfully"
        Write-Host "Location: $Downloads\samptest"

    - name: Install OpenCode AI
      shell: pwsh
      run: |
        npm install -g opencode-ai

        Write-Host "Installed OpenCode:"
        opencode --version

    - name: Install Dependency Compiler
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
          -OutFile "chrome-remote-desktop.msi"

        Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList "/i chrome-remote-desktop.msi /quiet /norestart" `
          -Wait

        Remove-Item "chrome-remote-desktop.msi" -Force

    - name: Install Visual C++ 2010 (x86 & x64)
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe" `
          -OutFile "vcredist_x86.exe"

        Invoke-WebRequest `
          -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe" `
          -OutFile "vcredist_x64.exe"

        Start-Process `
          -FilePath "vcredist_x86.exe" `
          -ArgumentList "/quiet /norestart" `
          -Wait

        Start-Process `
          -FilePath "vcredist_x64.exe" `
          -ArgumentList "/quiet /norestart" `
          -Wait

    - name: Configure Everything
      shell: pwsh
      run: |
        $PIN = "123456"
        $CRDCode = "${{ inputs.student_code }}"

        & "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" `
          --code=$CRDCode `
          --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
          --name=$Env:COMPUTERNAME `
          --pin=$PIN

    - name: Just Wait For a While
      shell: pwsh
      run: |
        Start-Sleep -Seconds 36000

    - name: Display Completion Message
      shell: pwsh
      run: |
        Write-Host "Setup Complete and Now You Can Close This"
