name: Setup Student Community Compiler

on:
  workflow_dispatch:
    inputs:
      student_code:
        description: "Enter the Student Authentication Code"
        required: true

jobs:
  setup-student:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Update System
        run: |
          sudo apt update

      - name: Install Desktop Environment
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt install -y \
            xfce4 \
            xfce4-goodies \
            xvfb \
            wget \
            curl

      - name: Install Google Chrome
        run: |
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb || sudo apt --fix-broken install -y

      - name: Install Chrome Remote Desktop
        run: |
          wget https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb
          sudo apt install -y ./chrome-remote-desktop_current_amd64.deb || sudo apt --fix-broken install -y

      - name: Configure Session
        run: |
          echo "startxfce4" > ~/.chrome-remote-desktop-session
          chmod +x ~/.chrome-remote-desktop-session

      - name: Start Virtual Display
        run: |
          sudo Xvfb :1 -screen 0 1920x1080x24 &
          echo "DISPLAY=:1" >> $GITHUB_ENV

      - name: Authenticate Chrome Remote Desktop
        run: |
          DISPLAY=:1

          PIN="123456"
          CRD_CODE="${{ inputs.student_code }}"

          /opt/google/chrome-remote-desktop/start-host \
            --code="$CRD_CODE" \
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
            --name="$(hostname)" \
            --pin="$PIN"

      - name: Keep Alive
        run: |
          echo "Remote desktop is running..."
          sleep 36000

      - name: Done
        run: |
          echo "Setup completed."
