name: Setup Student Community Compiler v2

on:
  workflow_dispatch:
    inputs:
      student_code:
        description: "Enter the Student Authentication Code"
        required: true
        default: ""

jobs:
  setup-student:
    runs-on: windows-latest

    steps:
      - name: Install Chrome Remote Desktop
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" -OutFile "chrome-remote-desktop.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i chrome-remote-desktop.msi /quiet /norestart" -Wait
          Remove-Item -Path "chrome-remote-desktop.msi"

      - name: Configure Chrome Remote Desktop
        run: |
          $PIN = "123456"
          $CRDCode = "${{ inputs.student_code }}"

          & "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe" `
            --code=$CRDCode `
            --redirect-url="https://remotedesktop.google.com/_/oauthredirect" `
            --name=$Env:COMPUTERNAME `
            --pin=$PIN

      - name: Set Dark Mode
        run: |
          reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize /v AppsUseLightTheme /t REG_DWORD /d 0 /f
          reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize /v SystemUsesLightTheme /t REG_DWORD /d 0 /f

      - name: Change Password runneradmin
        run: |
          net user runneradmin "Nathan#1234"

      - name: Install Visual C++ 2010 (x86 & x64)
        run: |
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x86.exe" -OutFile "vcredist_x86.exe"
          Invoke-WebRequest -Uri "https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe" -OutFile "vcredist_x64.exe"

          Start-Process -FilePath "vcredist_x86.exe" -ArgumentList "/quiet /norestart" -Wait
          Start-Process -FilePath "vcredist_x64.exe" -ArgumentList "/quiet /norestart" -Wait

      - name: Install ZeroTier + Join
        run: |
          Invoke-WebRequest -Uri "https://download.zerotier.com/dist/ZeroTier%20One.msi" -OutFile "zerotier.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i zerotier.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 10
          & "C:\Program Files (x86)\ZeroTier\One\zerotier-cli.bat" join b103a835d2e8ff19

      - name: Backup, Download & Extract Pterodactyl Files
        env:
          PTERO_API_KEY: ${{ secrets.PTERO_API_KEY }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
          PTERO_PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
        shell: pwsh
        run: |
          Write-Output "=== START PTERO BACKUP ==="

          $headers = @{
            "Authorization" = "Bearer $env:PTERO_API_KEY"
            "Accept"        = "Application/vnd.pterodactyl.v1+json"
            "Content-Type"  = "application/json"
          }

          # ── 1. Buat archive ─────────────────────────────
          $body = @{
            root  = "/"
            files = @("pawno", "gamemodes")
          } | ConvertTo-Json -Compress

          Write-Output "Creating archive..."
          $archive = Invoke-RestMethod -Method Post `
            -Uri "$env:PTERO_PANEL_URL/api/client/servers/$env:PTERO_SERVER_ID/files/compress" `
            -Headers $headers `
            -Body $body

          $archiveName = $archive.attributes.name
          if (-not $archiveName) { throw "Archive name kosong – cek API response" }
          Write-Output "Archive created: $archiveName"

          # ── 2. Ambil download URL ───────────────────────
          $maxTry = 10
          $url    = $null

          for ($i = 1; $i -le $maxTry; $i++) {
            Write-Output "Fetching download URL (attempt $i/$maxTry)..."
            Start-Sleep -Seconds 6

            try {
              $dlUri    = "$env:PTERO_PANEL_URL/api/client/servers/$env:PTERO_SERVER_ID/files/download"
              $response = Invoke-RestMethod -Method Get `
                -Uri "$dlUri`?file=$([uri]::EscapeDataString($archiveName))" `
                -Headers $headers

              $url = $response.attributes.url
              if ($url) { break }
            } catch {
              Write-Output "Not ready yet: $($_.Exception.Message)"
            }
          }

          if (-not $url) { throw "Gagal mendapatkan download URL" }

          # ── 3. Download ────────────────────────────────
          curl.exe -fSL --retry 3 --retry-delay 5 "$url" -o "$archiveName"

          # ── 4. Extract ─────────────────────────────────
          $extractDir = "extract"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          tar -xzf $archiveName -C $extractDir

          # ── 5. Susun folder ────────────────────────────
          @("gm", "gm\pawno", "gm\gamemodes") | ForEach-Object {
            New-Item -ItemType Directory -Force -Path $_ | Out-Null
          }

          $pawnoSrc = Get-ChildItem -Recurse -Directory $extractDir | Where-Object Name -eq "pawno" | Select-Object -First 1
          $gmSrc    = Get-ChildItem -Recurse -Directory $extractDir | Where-Object Name -eq "gamemodes" | Select-Object -First 1

          if ($pawnoSrc) {
            Copy-Item -Recurse -Force "$($pawnoSrc.FullName)\*" "gm\pawno\"
          }

          if ($gmSrc) {
            Copy-Item -Recurse -Force "$($gmSrc.FullName)\*" "gm\gamemodes\"
          }

          # ── 6. Delete archive ──────────────────────────
          $deleteBody = @{
            root  = "/"
            files = @($archiveName)
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Method Post `
            -Uri "$env:PTERO_PANEL_URL/api/client/servers/$env:PTERO_SERVER_ID/files/delete" `
            -Headers $headers `
            -Body $deleteBody

          Write-Output "=== DONE BACKUP ==="

      - name: Add Time
        shell: pwsh
        run: |
          Start-Sleep -Seconds 36000

      - name: Display Completion Message
        run: |
          echo "Setup Complete and Now You Can Close This"
